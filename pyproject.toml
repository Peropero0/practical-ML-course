[project]
name = "practical-ml-course"
version = "1.0"
description = "A hands-on course in classical machine learning with scikit-learn and XGBoost"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scikit-learn>=1.1,<1.4",
    "xgboost>=1.6",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "ipykernel>=6",
    "statsmodels>=0.13",
]

[project.optional-dependencies]
dev = ["nbformat", "nbclient"]     # to rebuild and test the notebooks (python _tools/run.py)
